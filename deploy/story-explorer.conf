server {
    listen 80;
    server_name story-explorer.nas.haiqingd.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host:1443$request_uri; }
}
server {
    listen 8443 ssl;
    server_name story-explorer.nas.haiqingd.top;
    ssl_certificate /etc/nginx/local-certs/story-explorer.crt;
    ssl_certificate_key /etc/nginx/local-certs/story-explorer.key;
    client_max_body_size 16m;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $story_explorer_backend story-explorer:8080;
        proxy_pass http://$story_explorer_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}
