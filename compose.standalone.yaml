# Independent Docker deployment without the shared Nginx gateway.
name: story-explorer-standalone
services:
  app:
    build: .
    image: story-explorer:local
    restart: unless-stopped
    user: "${LOOPER_UID:-1000}:${LOOPER_GID:-1000}"
    ports:
      - "127.0.0.1:${LOOPER_PORT:-8765}:8080"
    environment:
      LOOPER_PUBLIC_ORIGINS: "http://127.0.0.1:${LOOPER_PORT:-8765},http://localhost:${LOOPER_PORT:-8765}"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
